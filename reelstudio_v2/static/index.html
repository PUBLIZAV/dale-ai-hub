<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReelStudio IA V2</title><style>body{background:#10101e;color:#f8f6ff;font:16px system-ui;margin:0}main{max-width:980px;margin:40px auto;padding:25px}h1{color:#b29afa}section{background:#202033;border:1px solid #37374c;border-radius:18px;padding:25px;margin:15px 0}input,select,textarea,button{box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #676082;background:#141424;color:white;width:100%}button{background:#a48af4;color:#10101e;font-weight:700;cursor:pointer}label{display:block;margin-top:12px}a{color:#c1b1ff}small{color:#bab8ca}pre{white-space:pre-wrap;overflow-wrap:anywhere}video{max-width:100%;max-height:500px}</style></head><body><main><h1>▶ ReelStudio IA — V2</h1><p>Edición multiclip local • disolvencias • formatos sociales • revisión</p><section><h2>01 / Crear reel</h2><form id="form"><label>Videos e imágenes (selecciona varios)</label><input name="files" type="file" accept="video/*,image/*,audio/*" multiple required><label>Cliente</label><input name="client_id" value="general" pattern="[a-zA-Z0-9_-]+"><label>Campaña</label><input name="campaign_id" value="prueba" pattern="[a-zA-Z0-9_-]+"><label>Instrucción o brief (se guarda para futuras fases de IA)</label><textarea name="brief">Reel comercial con transiciones suaves</textarea><label>Duración máxima (segundos)</label><input name="duration_seconds" type="number" min="1" max="180" value="15"><label>Estilo de transición</label><select name="style"><option value="corporativo">Corporativo</option><option value="comercial">Comercial</option><option value="cinematografico">Cinematográfico</option><option value="dinamico">Dinámico</option></select><label>Formatos de exportación</label><select name="outputs"><option value="9:16,4:5,1:1">Todos (9:16, 4:5, 1:1)</option><option value="9:16">Solo vertical 9:16</option><option value="4:5">Solo 4:5</option><option value="1:1">Solo cuadrado</option></select><button type="submit">Crear reel</button></form><p id="status"></p></section><section><h2>02 / Resultados</h2><div id="out">No hay trabajo todavía.</div></section><small>V2 inicial: las transiciones son disolvencias; sin subtítulos automáticos, interpretación semántica del brief ni mezcla de audio todavía.</small></main><script>let id=null;const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Subiendo archivos…';$('out').textContent='';try{const r=await fetch('/jobs',{method:'POST',body:new FormData(e.target)});const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));id=j.job_id;poll()}catch(e){$('status').textContent=e.message}};async function poll(){try{const j=await (await fetch('/jobs/'+id)).json();$('status').textContent=`Estado: ${j.status} · ${j.progress}%`+(j.error?' · '+j.error:'');if(j.status==='ready_for_review'){const o=await(await fetch('/jobs/'+id+'/outputs')).json();$('out').innerHTML=o.files.map(f=>`<p><a href="${f.url}" download>${f.name}</a></p>`).join('');const vid=o.files.find(f=>f.name.endsWith('9x16.mp4'));if(vid){let v=document.createElement('video');v.controls=true;v.src=vid.url;$('out').prepend(v)}let b=document.createElement('button');b.textContent='Rehacer con otro estilo';b.onclick=async()=>{let style=prompt('Estilo: corporativo, comercial, cinematografico, dinamico','dinamico');if(!style)return;await fetch('/jobs/'+id+'/revisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({style,notes:'Solicito nueva versión'})});$('out').textContent='';poll()};$('out').append(b)}else if(['queued','processing'].includes(j.status))setTimeout(poll,1800)}catch(e){$('status').textContent=e.message}}</script></body></html>
